<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f4eb">
  <title>Word Counter | Tool Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tool="word-counter">
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">TH</span><span>Tool Hub</span></a>
      <label class="visually-hidden" for="lang" data-i18n="language"></label>
      <select class="language" id="lang"><option value="en">English</option><option value="hi">हिंदी</option><option value="te">తెలుగు</option><option value="ur">اردو</option></select>
    </header>
    <main class="page-main">
      <a class="back-link" href="index.html" data-i18n="back"></a>
      <section class="page-heading"><p class="eyebrow" data-i18n="wordEyebrow"></p><h1 data-i18n="wc"></h1></section>
      <section class="tool-panel" aria-label="Word counter">
        <label class="visually-hidden" for="word-text" data-i18n="wc"></label>
        <textarea id="word-text" data-placeholder="wcPlaceholder" dir="auto" spellcheck="true"></textarea>
        <div class="stat-row" aria-live="polite">
          <div><span class="stat-label" data-i18n="words"></span><output class="stat-value" id="word-count">0</output></div>
          <div><span class="stat-label" data-i18n="chars"></span><output class="stat-value" id="char-count">0</output></div>
        </div>
        <p class="tool-status" data-i18n="pageHint"></p>
      </section>
    </main>
    <footer><span>Tool Hub</span><span data-i18n="footer"></span></footer>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
