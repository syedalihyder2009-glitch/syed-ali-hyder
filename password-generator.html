<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f2f4eb">
  <title>Password Generator | Tool Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-tool="password-generator">
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">TH</span><span>Tool Hub</span></a>
      <label class="visually-hidden" for="lang" data-i18n="language"></label>
      <select class="language" id="lang"><option value="en">English</option><option value="hi">हिंदी</option><option value="te">తెలుగు</option><option value="ur">اردو</option></select>
    </header>
    <main class="page-main">
      <a class="back-link" href="index.html" data-i18n="back"></a>
      <section class="page-heading"><p class="eyebrow" data-i18n="passwordEyebrow"></p><h1 data-i18n="pg"></h1></section>
      <section class="tool-panel" aria-label="Password generator">
        <div class="range-row"><label for="password-length" data-i18n="length"></label><output class="range-value" id="password-length-value">16</output></div>
        <input type="range" id="password-length" min="8" max="40" value="16">
        <output class="password-output" id="password-output" aria-label="Generated password">-</output>
        <div class="button-row">
          <button class="tool-button" id="generate-password" type="button" data-i18n="generate"></button>
          <button class="tool-button secondary" id="copy-password" type="button" data-i18n="copy" disabled></button>
        </div>
        <p class="tool-status" id="password-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <footer><span>Tool Hub</span><span data-i18n="footer"></span></footer>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
